local_backend: true

backend:
  name: git-gateway
  branch: lab4

media_folder: "images"
public_folder: "/images"

collections:
  - label: "Site Content"
    name: "site"
    files:
      - label: "Landing Page Content"
        name: "landing"
        file: "src/_data/site.json"
        fields:
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "OG Title", name: "ogTitle", widget: "string" }
              - { label: "OG Description", name: "ogDescription", widget: "text" }
              - { label: "OG Image URL", name: "ogImage", widget: "string" }
              - { label: "Twitter Card", name: "twitterCard", widget: "string" }
              - { label: "Twitter Title", name: "twitterTitle", widget: "string" }
              - { label: "Twitter Description", name: "twitterDescription", widget: "text" }
              - { label: "Twitter Image URL", name: "twitterImage", widget: "string" }

          - label: "Brand"
            name: "brand"
            widget: "object"
            fields:
              - { label: "Logo Prefix", name: "logoPrefix", widget: "string" }
              - { label: "Logo Suffix", name: "logoSuffix", widget: "string" }
              - { label: "Favicon Path", name: "favicon", widget: "string" }

          - label: "Navigation"
            name: "navigation"
            widget: "object"
            fields:
              - { label: "Main Nav Aria Label", name: "ariaLabel", widget: "string" }
              - { label: "Mobile Nav Aria Label", name: "mobileAriaLabel", widget: "string" }
              - { label: "Footer Nav Aria Label", name: "footerAriaLabel", widget: "string" }
              - { label: "Home", name: "home", widget: "string" }
              - { label: "Services", name: "services", widget: "string" }
              - { label: "About", name: "about", widget: "string" }
              - { label: "Gallery", name: "gallery", widget: "string" }
              - { label: "FAQ", name: "faq", widget: "string" }
              - { label: "Contact", name: "contact", widget: "string" }
              - { label: "Quote CTA", name: "quote", widget: "string" }

          - label: "Visible Sections"
            name: "visibleSections"
            widget: "list"
            hint: "Delete an item to hide a section. Add it back to show the section again."
            field:
              label: "Section"
              name: "section"
              widget: "select"
              options:
                - "hero"
                - "mobileBanner"
                - "about"
                - "services"
                - "testimonials"
                - "trust"
                - "gallery"
                - "faq"
                - "contact"
                - "ctaStrip"
                - "stickyCta"
                - "mascot"
                - "footer"

          - label: "Section Labels"
            name: "sections"
            widget: "object"
            fields:
              - { label: "About Label", name: "aboutLabel", widget: "string" }
              - { label: "Services Label", name: "servicesLabel", widget: "string" }
              - { label: "Services Title", name: "servicesTitle", widget: "string" }
              - { label: "Testimonials Label", name: "testimonialsLabel", widget: "string" }
              - { label: "Testimonials Title", name: "testimonialsTitle", widget: "string" }
              - { label: "Gallery Label", name: "galleryLabel", widget: "string" }
              - { label: "Gallery Title", name: "galleryTitle", widget: "string" }
              - { label: "FAQ Label", name: "faqLabel", widget: "string" }
              - { label: "FAQ Title", name: "faqTitle", widget: "string" }
              - { label: "Contact Label", name: "contactLabel", widget: "string" }
              - { label: "Contact Title", name: "contactTitle", widget: "string" }

          - label: "Contact Card Labels"
            name: "contactCard"
            widget: "object"
            fields:
              - { label: "Phone Title", name: "phoneTitle", widget: "string" }
              - { label: "Email Title", name: "emailTitle", widget: "string" }
              - { label: "Location Title", name: "locationTitle", widget: "string" }

          - label: "Contact Form"
            name: "contactForm"
            widget: "object"
            fields:
              - { label: "Name Placeholder", name: "namePlaceholder", widget: "string" }
              - { label: "Email Placeholder", name: "emailPlaceholder", widget: "string" }
              - { label: "Phone Placeholder", name: "phonePlaceholder", widget: "string" }
              - { label: "Message Placeholder", name: "messagePlaceholder", widget: "string" }
              - { label: "Submit Text", name: "submitText", widget: "string" }

          - label: "Mascot"
            name: "mascot"
            widget: "object"
            fields:
              - { label: "Aria Label", name: "ariaLabel", widget: "string" }
              - { label: "Bubble Message", name: "message", widget: "text" }

          - label: "Sticky CTA"
            name: "stickyCta"
            widget: "object"
            fields:
              - { label: "Button Text", name: "text", widget: "string" }
              - { label: "Button Href", name: "href", widget: "string" }

          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Primary CTA Text", name: "primaryCtaText", widget: "string" }
              - { label: "Primary CTA Href", name: "primaryCtaHref", widget: "string" }
              - { label: "Secondary CTA Text", name: "secondaryCtaText", widget: "string" }
              - { label: "Secondary CTA Href", name: "secondaryCtaHref", widget: "string" }

          - label: "Mobile Banner"
            name: "mobileBanner"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Phone Label", name: "phoneLabel", widget: "string" }
              - { label: "Phone Href", name: "phoneHref", widget: "string" }

          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Paragraph 1", name: "paragraph1", widget: "text" }
              - { label: "Paragraph 2", name: "paragraph2", widget: "text" }

          - label: "Stats"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Icon (shield/clock/location)", name: "icon", widget: "string" }

          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Initials", name: "initials", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Quote", name: "quote", widget: "text" }

          - label: "Trust Strip"
            name: "trust"
            widget: "object"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - label: "Logos"
                name: "logos"
                widget: "list"
                field: { label: "Logo Label", name: "logo", widget: "string" }

          - label: "Gallery"
            name: "gallery"
            widget: "list"
            field: { label: "Image Path", name: "image", widget: "image" }

          - label: "FAQ"
            name: "faq"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Phone Href", name: "phoneHref", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }

          - label: "CTA Strip"
            name: "ctaStrip"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Href", name: "buttonHref", widget: "string" }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Year", name: "year", widget: "number" }
              - { label: "Company", name: "company", widget: "string" }

